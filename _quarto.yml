project:
  type: website
  output-dir: docs

website:
  search:
    location: navbar
    type: textbox
  site-url: https://guturago.github.io
  google-analytics: "G-VVGT96KRKH" 
  title: "Gutama Girja Urago"
  image: "./images/favicon.png"
  favicon: "./images/favicon.png"
  navbar:
    background: "#00263A"
    logo: "./images/favicon.png"
    title: "Home"
    left:
      - text: Blogs
        href: blog.html
      - text: Packages
        menu: 
          - text: "ethiodate: Working with Ethiopian Dates in R"
            href: https://guturago.github.io/ethiodate
            target: "_blank"
      - text: Resume
        href: resume.html
      - text: About
        href: about.html
        
    tools: 
      - text: GutUrago Github
        icon: github
        href: https://github.com/GutUrago
      - text: Linkedin
        icon: linkedin
        href: https://www.linkedin.com/in/gutama-girja/
      - text: GutUrago Blog RSS
        icon: rss
        href: blog.xml
        
  page-footer: 
    center: 
      - text: "All rights are reserved!"
    background: "#DCE3E3"
  

format:
  html:
    fontsize: 0.9em
    linkcolor: "blue"
    code-copy: true
    code-fold: false
    code-tools: false
    code-link: true
    code-block-border-left: true
    code-overflow: wrap
    code-block-bg: true
    theme: cosmo
    #css: styles.css
    toc: true
    grid: 
      content-mode: auto

execute:
  freeze: true
# set freeze to auto -> automatically render when source changes
